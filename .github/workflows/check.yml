# Будильник для Telegram Serverless: своего расписания там нет.
# Раз в 5 минут запускает проверку на серверах Телеграма.
name: check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # кнопка «Run workflow» для ручного запуска

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx tgcloud run endpoints/check '{}'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
