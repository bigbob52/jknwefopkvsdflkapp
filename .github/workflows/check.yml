# Будильник для Telegram Serverless: своего расписания там нет.
# Основной запуск — cron-job.org раз в 5 минут дёргает workflow_dispatch.
# Расписание GitHub — запасное: оно ненадёжное и часто пропускает запуски.
name: check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # ручной запуск и вызовы от cron-job.org

# Не больше одной проверки одновременно, иначе возможны дубли уведомлений
concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx tgcloud run endpoints/check '{}'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
